    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
      (function() {
        function applyThemeMeta(isDark) {
          var themeColor = isDark ? '#121212' : '#ffffff';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', themeColor);
          }
          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) {
            appleStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        }
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          applyThemeMeta(isDark);

          if (typeof MutationObserver !== 'undefined') {
            var observer = new MutationObserver(function() {
              applyThemeMeta(document.documentElement.classList.contains('dark'));
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
          }

          if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var onChange = function(e) {
              if (!localStorage.getItem('theme')) {
                if (e.matches) {
                  document.documentElement.classList.add('dark');
                } else {
                  document.documentElement.classList.remove('dark');
                }
                applyThemeMeta(e.matches);
              }
            };
            if (mq.addEventListener) {
              mq.addEventListener('change', onChange);
            } else if (mq.addListener) {
              mq.addListener(onChange);
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Global Chunk / Asset Load Failure Recovery -->
    <script>
      (function() {
        var reloadKey = 'mahjong_chunk_reload_ts';
        function tryRecover() {
          try {
            var last = sessionStorage.getItem(reloadKey);
            var now = Date.now();
            if (!last || now - parseInt(last, 10) > 12000) {
              sessionStorage.setItem(reloadKey, String(now));
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) {
                    regs[i].update();
                  }
                });
              }
              window.location.reload();
            }
          } catch (e) {}
        }

        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.indexOf('/assets/') !== -1) {
              tryRecover();
              return;
            }
          }
          var msg = (e && e.message) ? e.message : '';
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('Refused to apply style') !== -1
          ) {
            tryRecover();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('Importing a module script failed') !== -1
          ) {
            tryRecover();
          }
        });
      })();
    </script>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
