<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>김케이 하우스</title>
    <meta name="description" content="김케이 하우스 마작 대시보드 및 점수 기록기">
    <link rel="icon" type="image/svg+xml" href="/riichi-stick.svg" />
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Handler (MIT License)
      // Converts the current path and query string into a query-based redirect
      // while immediately setting the accurate Korean page title so browser tabs,
      // history entries, and link previews never show a generic placeholder title.
      (function() {
        try {
          var l = window.location;
          var params = new URLSearchParams(l.search || '');
          var qPlayer = (params.get('player') || '').trim();
          var qSession = (params.get('session') || '').trim();
          var qDate = (params.get('date') || '').trim();
          var qPhoto = (params.get('photo') || '').trim();
          var qTab = (params.get('tab') || '').trim();
          var tabMap = {
            ranking: '종합 랭킹',
            rating: '레이팅',
            matrix: '역대 전적',
            sessions: '회차 상세',
            schedule: '일정',
            rules: '룰',
            gallery: '갤러리'
          };
          if (qPlayer) {
            var sessLabel = qSession ? (/^\d+$/.test(qSession) ? '제' + qSession + '회' : qSession) : '';
            document.title = (sessLabel ? qPlayer + ' (' + sessLabel + ') 통계' : qPlayer + ' 통계') + ' | 김케이 하우스';
          } else if (qSession) {
            var sLabel = /^\d+$/.test(qSession) ? '제' + qSession + '회' : qSession;
            document.title = sLabel + ' 상세 | 김케이 하우스';
          } else if (qDate) {
            var dLabel = /^\d{6}$/.test(qDate) ? (qDate.slice(0, 2) + '.' + qDate.slice(2, 4) + '.' + qDate.slice(4, 6)) : qDate;
            document.title = '일정 (' + dLabel + ') | 김케이 하우스';
          } else if (qPhoto) {
            document.title = '갤러리 | 김케이 하우스';
          } else if (qTab && tabMap[qTab]) {
            document.title = tabMap[qTab] + ' | 김케이 하우스';
          } else if (l.pathname.indexOf('/dashboard') !== -1 || l.pathname.indexOf('/stats') !== -1) {
            document.title = '종합 랭킹 | 김케이 하우스';
          } else {
            document.title = '김케이 하우스 점수 기록기';
          }
        } catch (e) {}
      })();

      var pathSegmentsToKeep = window.location.hostname.includes('github.io') ? 1 : 0;

      var l = window.location;
      if (l.search && l.search.indexOf('?/') !== -1) {
        var baseDir = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + (baseDir ? baseDir + '/' : '/'));
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }

    </script>
  </head>
  <body>
  </body>
</html>
